<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>T2B · Sip & Bite (키오스크)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF7EF;
  --cream-deep:#F3ECDD;
  --navy:#14233F;
  --navy-dark:#0F1E36;
  --navy-light:#1C3459;
  --gold:#E8A33D;
  --gold-deep:#C97C1D;
  --gold-light:#EFB456;
  --sage:#8CA482;
  --sage-light:#A6BE9B;
  --sage-deep:#7C9473;
  --text:#1B1B1B;
  --text-sub:#4B4B45;
  --text-desc:#55524A;
  --card-border:#EEE7D8;
  --white:#FFFFFF;
  --passion:#E4572E;
  --stable:#4E8A5B;
  --positive:#EFA92B;
  --growth:#8B5E34;
  --calm:#5B7C99;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--cream);color:var(--text);font-family:'Noto Sans KR',sans-serif;overflow:hidden;}
.serif{font-family:'Gowun Batang',serif;}
#app{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;}

/* ---------- HEADER ---------- */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;background:var(--white);
  border-bottom:1px solid var(--card-border);
  flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand img{height:52px;width:auto;display:block;}
.brand .wordmark{display:flex;flex-direction:column;line-height:1.05;}
.brand .wordmark b{font-size:20px;letter-spacing:1px;color:var(--navy);font-weight:900;}
.brand .wordmark span{font-family:'Gowun Batang',serif;font-size:12px;color:var(--sage-deep);letter-spacing:2px;}

.tabs{display:flex;gap:8px;background:var(--cream-deep);padding:5px;border-radius:999px;}
.tab-btn{
  border:none;background:transparent;padding:11px 22px;border-radius:999px;
  font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:14.5px;color:var(--text-sub);
  cursor:pointer;transition:all .2s;white-space:nowrap;
}
.tab-btn.active{background:var(--navy);color:var(--cream);box-shadow:0 3px 10px rgba(20,35,63,.25);}

.conn{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-sub);}
.conn .dot{width:8px;height:8px;border-radius:50%;background:#C7BDA6;}
.conn .dot.live{background:var(--sage-deep);box-shadow:0 0 0 3px rgba(140,164,130,.25);}

main{flex:1;min-height:0;position:relative;}
.screen{position:absolute;inset:0;overflow-y:auto;display:none;}
.screen.active{display:block;}

/* ---------- IDLE / ATTRACT SCREEN ---------- */
.idle-overlay{
  position:fixed;inset:0;z-index:200;
  background:var(--cream);
  display:none;flex-direction:column;
  cursor:pointer;overflow:hidden;
}
.idle-overlay.show{display:flex;animation:idleFadeIn .5s ease;}
@keyframes idleFadeIn{from{opacity:0;}to{opacity:1;}}

.idle-corner-navy{
  position:absolute;top:-40px;left:-40px;width:300px;height:300px;
  background:var(--navy);clip-path:polygon(0 0,100% 0,0 100%);opacity:.96;
}
.idle-corner-gold{
  position:absolute;top:-30px;right:-30px;width:220px;height:220px;
  background:radial-gradient(circle,var(--gold-light) 3px,transparent 3px) 0 0/16px 16px,
             linear-gradient(160deg,var(--gold-light),var(--gold-deep));
  clip-path:polygon(100% 0,100% 100%,0 0);opacity:.9;
}

.idle-scroll{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;padding:30px 48px 0;}

.idle-header{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
.idle-header img{height:44px;}
.idle-header .wm{display:flex;flex-direction:column;line-height:1.05;}
.idle-header .wm b{font-size:17px;color:var(--navy);font-weight:900;}
.idle-header .wm span{font-family:'Gowun Batang',serif;font-size:11px;color:var(--sage-deep);letter-spacing:2px;}

.idle-headline{
  font-family:'Gowun Batang',serif;font-size:clamp(26px,3.6vw,38px);color:var(--navy);
  text-align:center;line-height:1.4;margin:18px 0 8px;
}
.idle-headline .c1{color:var(--gold-deep);}
.idle-headline .c2{color:var(--sage-deep);}
.idle-sub{text-align:center;color:var(--text-sub);font-size:14.5px;margin:0 0 26px;}

.idle-main{
  display:flex;align-items:center;justify-content:center;gap:44px;
  max-width:980px;margin:0 auto;flex-wrap:wrap;
}
.idle-photo{
  width:280px;height:280px;object-fit:cover;border-radius:22px;flex-shrink:0;
  box-shadow:0 20px 44px rgba(20,35,63,.18);
}
.idle-flow{display:flex;flex-direction:column;gap:0;min-width:280px;}
.idle-flow-step{display:flex;align-items:flex-start;gap:16px;position:relative;padding-bottom:22px;}
.idle-flow-step:last-child{padding-bottom:0;}
.idle-flow-step:not(:last-child)::before{
  content:"";position:absolute;left:23px;top:48px;bottom:0;width:2px;
  background-image:linear-gradient(#C9BFA8 60%,rgba(0,0,0,0) 0%);background-size:2px 8px;background-repeat:repeat-y;
}
.idle-flow-icon{
  width:48px;height:48px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 10px rgba(20,35,63,.18);
}
.idle-flow-icon svg{width:22px;height:22px;}
.idle-flow-text b{font-size:16px;color:var(--navy);}
.idle-flow-text b span{font-weight:900;margin-right:3px;}
.idle-flow-text p{margin:3px 0 0;font-size:12.5px;color:var(--text-sub);line-height:1.5;}

.idle-cta{
  position:relative;z-index:1;flex-shrink:0;background:var(--navy);color:var(--cream);
  text-align:center;padding:18px;font-weight:800;font-size:15.5px;letter-spacing:.3px;
  animation:idlePulse 1.8s ease-in-out infinite;
}
@keyframes idlePulse{0%,100%{opacity:.82;}50%{opacity:1;}}

/* ---------- ORDER TAB ---------- */
.order-wrap{display:flex;height:100%;}
.order-main{flex:1;padding:22px 26px;overflow-y:auto;}
.cat-toggle{display:flex;gap:10px;margin-bottom:18px;}
.cat-btn{
  border:1.5px solid var(--card-border);background:var(--white);padding:9px 20px;border-radius:12px;
  font-weight:700;font-size:14.5px;color:var(--text-sub);cursor:pointer;
}
.cat-btn.active{border-color:var(--navy);background:var(--navy);color:var(--cream);}

.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
.menu-card{
  background:var(--white);border:1px solid var(--card-border);border-radius:14px;padding:14px;
  cursor:pointer;transition:transform .15s, box-shadow .15s;position:relative;
}
.menu-card:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(20,35,63,.10);}
.menu-card .tag{
  display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;
  color:#fff;margin-bottom:8px;
}
.menu-card .name{font-weight:700;font-size:15.5px;color:var(--navy);margin-bottom:3px;}
.menu-card .note{font-size:12px;color:var(--text-sub);margin-bottom:10px;min-height:16px;}
.menu-card .price{font-weight:700;color:var(--gold-deep);font-size:14.5px;}
.menu-card .add-hint{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;background:var(--cream-deep);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--navy);font-weight:900;}

.cart-panel{
  width:300px;flex-shrink:0;background:var(--white);border-left:1px solid var(--card-border);
  display:flex;flex-direction:column;padding:20px;
  min-height:0;overflow-y:auto;
}
.cart-panel h3{margin:0 0 14px;font-size:16px;color:var(--navy);flex-shrink:0;}
.cart-items{flex:1;overflow-y:visible;min-height:0;}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--card-border);font-size:13.5px;}
.cart-item .qty-ctrl{display:flex;align-items:center;gap:8px;}
.cart-item .qty-ctrl button{width:22px;height:22px;border-radius:50%;border:1px solid var(--card-border);background:var(--cream);cursor:pointer;font-weight:700;}
.cart-empty{color:var(--text-sub);font-size:13px;text-align:center;padding:30px 0;}
.cart-total{
  display:flex;justify-content:space-between;font-weight:900;font-size:16px;color:var(--navy);
  padding:14px 0;border-top:2px solid var(--navy);margin-top:8px;flex-shrink:0;
}
.order-confirm-btn{
  background:var(--gold-deep);color:#fff;border:none;border-radius:12px;padding:14px;font-weight:900;
  font-size:15px;cursor:pointer;margin-top:10px;flex-shrink:0;
}
.order-confirm-btn:disabled{background:#D8CFB8;cursor:not-allowed;}
.name-input{
  width:100%;padding:10px 12px;border:1.5px solid var(--card-border);border-radius:10px;margin-bottom:12px;
  font-family:'Noto Sans KR',sans-serif;font-size:13.5px;
}

/* ---------- DIAGNOSIS TAB ---------- */
.diag-wrap{height:100%;display:flex;align-items:center;justify-content:center;padding:30px;}
.diag-stage{width:100%;max-width:640px;}

.diag-intro{text-align:center;}
.diag-intro img{width:150px;margin-bottom:14px;}
.diag-intro h1{font-family:'Gowun Batang',serif;font-size:28px;color:var(--navy);margin:0 0 10px;}
.diag-intro p{color:var(--text-sub);font-size:14.5px;line-height:1.7;margin:0 0 26px;}
.start-btn{
  background:linear-gradient(135deg,var(--gold-light),var(--gold-deep));color:#fff;border:none;
  padding:16px 44px;border-radius:999px;font-weight:900;font-size:16px;cursor:pointer;
  box-shadow:0 8px 20px rgba(201,124,29,.3);
}

.progress-bar{height:6px;background:var(--cream-deep);border-radius:999px;overflow:hidden;margin-bottom:26px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--sage),var(--gold));border-radius:999px;transition:width .4s ease;}
.q-count{text-align:center;font-size:12.5px;color:var(--text-sub);font-weight:700;margin-bottom:6px;letter-spacing:.5px;}
.q-text{font-size:19px;font-weight:700;color:var(--navy);text-align:center;margin:0 0 26px;line-height:1.5;}
.opt-list{display:flex;flex-direction:column;gap:10px;}
.opt-btn{
  text-align:left;background:var(--white);border:1.6px solid var(--card-border);border-radius:14px;
  padding:15px 18px;font-family:'Noto Sans KR',sans-serif;font-size:14.5px;color:var(--text);
  cursor:pointer;transition:all .15s;line-height:1.5;
}
.opt-btn:hover{border-color:var(--gold);background:#FFFBF3;}
.opt-btn.selected{border-color:var(--navy);background:var(--navy);color:var(--cream);}

.analyzing{text-align:center;padding:60px 0;}
.spinner{
  width:64px;height:64px;border-radius:50%;border:5px solid var(--cream-deep);border-top-color:var(--gold-deep);
  margin:0 auto 22px;animation:spin 0.9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.analyzing p{color:var(--text-sub);font-weight:700;font-size:14.5px;}

/* result card news */
.result-wrap{perspective:1400px;}
.result-badge-zone{display:flex;justify-content:center;margin-bottom:20px;}
.result-badge{
  width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 24px rgba(20,35,63,.22);
  animation:spinReveal 1.1s cubic-bezier(.2,.9,.25,1);
}
@keyframes spinReveal{
  0%{transform:rotateY(0deg) scale(.4);opacity:0;}
  55%{transform:rotateY(900deg) scale(1.08);opacity:1;}
  100%{transform:rotateY(1080deg) scale(1);opacity:1;}
}
.result-badge svg{width:56px;height:56px;}

.card-news{
  background:var(--white);border-radius:20px;border:1px solid var(--card-border);
  box-shadow:0 16px 36px rgba(20,35,63,.12);overflow:hidden;
  animation:cardPop .55s cubic-bezier(.2,.9,.25,1) .15s both;
}
@keyframes cardPop{from{transform:scale(.92) translateY(14px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
.card-news-slides{position:relative;min-height:230px;}
.card-slide{
  position:absolute;inset:0;padding:26px 30px;display:none;flex-direction:column;justify-content:center;
  animation:slideIn .4s ease;
}
.card-slide.active{display:flex;}
@keyframes slideIn{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:translateX(0);}}
.slide-eyebrow{font-size:11.5px;font-weight:800;letter-spacing:2px;color:var(--gold-deep);margin-bottom:8px;}
.slide-title{font-family:'Gowun Batang',serif;font-size:24px;color:var(--navy);margin:0 0 10px;line-height:1.35;}
.slide-body{font-size:14px;color:var(--text-desc);line-height:1.75;}
.slide-body b{color:var(--navy);}
.pairing-row{display:flex;gap:14px;margin-top:14px;}
.pairing-chip{flex:1;background:var(--cream-deep);border-radius:14px;padding:14px;text-align:center;}
.pairing-chip .k{font-size:11px;color:var(--text-sub);font-weight:700;margin-bottom:4px;}
.pairing-chip .v{font-size:14.5px;font-weight:800;color:var(--navy);margin-bottom:3px;}
.pairing-chip .n{font-size:11.5px;color:var(--text-sub);}

.dots{display:flex;justify-content:center;gap:7px;padding:14px 0 18px;}
.dot-i{width:7px;height:7px;border-radius:50%;background:var(--card-border);cursor:pointer;transition:all .2s;}
.dot-i.active{background:var(--gold-deep);width:20px;border-radius:4px;}

.result-actions{display:flex;gap:10px;margin-top:22px;}
.result-actions button{
  flex:1;padding:14px;border-radius:12px;font-weight:800;font-size:14.5px;border:none;cursor:pointer;
}
.btn-print{background:var(--navy);color:var(--cream);}
.btn-restart{background:var(--white);color:var(--navy);border:1.6px solid var(--card-border) !important;}

/* receipt */
.receipt-overlay{
  position:fixed;inset:0;background:rgba(20,35,63,.55);display:none;align-items:center;justify-content:center;z-index:50;
}
.receipt-overlay.show{display:flex;}
.receipt{
  width:300px;background:#faf6ee;color:#2a2118;padding:26px 22px;font-family:'Noto Sans KR',sans-serif;
  border-radius:4px;box-shadow:0 20px 50px rgba(0,0,0,.35);
  max-height:86vh;overflow-y:auto;
}
.receipt h4{text-align:center;font-family:'Gowun Batang',serif;font-size:18px;margin:0 0 4px;}
.receipt .sub{text-align:center;font-size:11px;color:#8a7d68;margin-bottom:14px;}
.receipt hr{border:none;border-top:1.5px dashed #cbbfa4;margin:12px 0;}
.receipt .line{display:flex;justify-content:space-between;font-size:12.5px;margin:5px 0;}
.receipt .big{font-size:14px;font-weight:800;}
.receipt-close{
  width:100%;margin-top:16px;padding:11px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-weight:800;cursor:pointer;
}

/* ---------- KITCHEN TAB ---------- */
.kitchen-wrap{padding:22px 26px;height:100%;overflow-y:auto;}
.kitchen-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.kitchen-head h2{margin:0;font-size:18px;color:var(--navy);}

.sales-summary{
  display:flex;gap:12px;align-items:stretch;margin-bottom:18px;flex-wrap:wrap;
}
.ss-box{
  background:var(--navy);color:var(--cream);border-radius:14px;padding:14px 22px;min-width:140px;
}
.ss-box .ss-num{font-size:22px;font-weight:900;line-height:1.1;}
.ss-box .ss-label{font-size:11.5px;color:#B9C3D6;margin-top:4px;font-weight:700;}
.ss-box.alt{background:var(--white);color:var(--navy);border:1.6px solid var(--card-border);}
.ss-box.alt .ss-label{color:var(--text-sub);}
.ss-items{
  flex:1;min-width:220px;background:var(--white);border:1.6px solid var(--card-border);border-radius:14px;
  padding:12px 16px;display:flex;flex-direction:column;justify-content:center;
}
.ss-items .ss-items-label{font-size:11px;color:var(--text-sub);font-weight:800;margin-bottom:6px;}
.ss-items .ss-item-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-desc);padding:2px 0;}
.ss-items .ss-item-row b{color:var(--navy);}
.ss-empty-note{font-size:12px;color:var(--text-sub);}
.sales-reset-btn{
  background:none;border:1.4px solid var(--card-border);color:var(--text-sub);border-radius:10px;
  padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;align-self:flex-start;
}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.ticket{
  background:var(--white);border:1px solid var(--card-border);border-radius:14px;padding:16px;
  animation:ticketIn .35s ease;position:relative;
}
.ticket.new{animation:ticketPulse 1.4s ease;}
@keyframes ticketIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
@keyframes ticketPulse{0%{box-shadow:0 0 0 0 rgba(232,163,61,.55);}70%{box-shadow:0 0 0 14px rgba(232,163,61,0);}100%{box-shadow:0 0 0 0 rgba(232,163,61,0);}}
.t-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.t-name{font-weight:800;color:var(--navy);font-size:15px;}
.t-time{font-size:11.5px;color:var(--text-sub);}
.chip{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;color:#fff;}
.chip.order{background:var(--sage-deep);}
.chip.diagnosis{background:var(--gold-deep);}
.t-body{font-size:13px;color:var(--text-desc);line-height:1.6;white-space:pre-line;}
.t-done{
  position:absolute;top:12px;right:12px;background:none;border:none;font-size:16px;cursor:pointer;color:var(--text-sub);
}
.empty-board{text-align:center;color:var(--text-sub);padding:60px 0;font-size:14px;}

/* ---------- RESPONSIVE (좁은 태블릿 / 폰 화면 대응) ---------- */
@media (max-width: 900px){
  header{padding:8px 12px;gap:8px;flex-wrap:wrap;row-gap:8px;}
  .brand img{height:34px;}
  .brand .wordmark b{font-size:14px;}
  .brand .wordmark span{font-size:9px;letter-spacing:1px;}
  .tabs{order:3;width:100%;overflow-x:auto;padding:4px;gap:4px;-webkit-overflow-scrolling:touch;}
  .tab-btn{padding:8px 14px;font-size:12.5px;white-space:nowrap;}
  .conn{font-size:10.5px;}
  .mode-title{font-size:12.5px !important;}

  .order-wrap{flex-direction:column;height:auto;min-height:100%;}
  .order-main{padding:14px;}
  .cart-panel{width:100%;border-left:none;border-top:1px solid var(--card-border);padding:14px;}
  .menu-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
  .menu-card{padding:11px;}
  .menu-card .name{font-size:13.5px;}

  .diag-wrap{padding:16px 12px;}
  .diag-intro h1{font-size:22px;}
  .diag-intro p{font-size:13px;}
  .q-text{font-size:16px;}
  .opt-btn{padding:12px 14px;font-size:13.5px;}
  .card-news{border-radius:16px;}
  .slide-title{font-size:19px;}
  .pairing-row{flex-direction:column;}

  .idle-scroll{padding:16px 18px 0;}
  .idle-headline{font-size:22px;}
  .idle-photo{width:180px;height:180px;}
  .idle-flow{min-width:0;}
  .idle-cta{font-size:12.5px;padding:12px;}

  .kitchen-wrap{padding:14px;}
  .board{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}
}

@media (max-width: 480px){
  .brand .wordmark span{display:none;}
  .tab-btn{padding:7px 10px;font-size:11.5px;}
  .menu-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
  .idle-headline{font-size:19px;}
  .idle-photo{width:140px;height:140px;}
  .idle-flow-text p{font-size:11px;}
  .receipt{width:88vw;}
}

</style>
</head>
<body>
<div id="app">

/* ticketsRef가 없어도(=Firebase 미설정) 나머지 코드가 절대 멈추지 않도록
   push / 실시간 감시를 안전하게 대신하는 래퍼 */
const safeTickets = {
  push(record) {
    if (ticketsRef) return ticketsRef.push(record);
    console.warn("Firebase 미설정: 주문/진단 결과가 저장되지 않았습니다.", record);
    return Promise.resolve();
  },
  onChildAdded(cb) {
    if (ticketsRef) ticketsRef.limitToLast(30).on("child_added", (snap) => cb(snap.val()));
  },
  onceHasAny(cb) {
    if (ticketsRef) ticketsRef.limitToLast(1).once("value", (snap) => cb(snap.exists()));
    else cb(false);
  },
};


/* =========================================================
   매출 집계 (기록 전용)
   - Firebase 설정 시: /salesSummary 노드에 transaction으로 누적
     (주방 화면에서 조회 가능하도록 데이터만 쌓아둠, 이 화면에는 표시하지 않음)
   - Firebase 미설정 시: 이 기기(이 세션)에서만 임시로 집계
   ========================================================= */
function salesKey(name) {
  return String(name).replace(/[.#$/\[\]]/g, "_");
}

let localSales = { amount: 0, count: 0, items: {} };

const safeSales = {
  record(amount, items) {
    if (db) {
      db.ref("salesSummary/amount").transaction((v) => (v || 0) + amount);
      db.ref("salesSummary/count").transaction((v) => (v || 0) + 1);
      (items || []).forEach((it) => {
        db.ref("salesSummary/items/" + salesKey(it.name)).transaction((v) => (v || 0) + it.qty);
      });
    } else {
      localSales.amount += amount;
      localSales.count += 1;
      (items || []).forEach((it) => {
        localSales.items[it.name] = (localSales.items[it.name] || 0) + it.qty;
      });
    }
  },
};

/* =========================================================

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function nowTime() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

      <h1>마인드 에너지 진단</h1>
      <p>5가지 질문에 답하면, 지금 당신에게 필요한<br>마인드 에너지와 꼭 맞는 디저트 &amp; 커피를 처방해드려요.</p>
      <button class="start-btn" id="startBtn">진단 시작하기</button>
    </div>`;
  document.getElementById("startBtn").addEventListener("click", () => {
    qIndex = 0;
    renderQuestion();
  });
}

function renderQuestion() {
  const item = QUESTIONS[qIndex];
  const pct = Math.round((qIndex / QUESTIONS.length) * 100);
  diagStage.innerHTML = `
    <div class="q-count">Q${qIndex + 1} / ${QUESTIONS.length}</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="q-text">${escapeHtml(item.q)}</div>
    <div class="opt-list">
      ${item.opts
        .map(
          (o, i) =>
            `<button class="opt-btn" data-i="${i}">${"①②③④⑤"[i]} ${escapeHtml(o.t)}</button>`
        )
        .join("")}
    </div>`;
  diagStage.querySelectorAll(".opt-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const opt = item.opts[Number(btn.dataset.i)];
      opt.types.forEach((t) => (scores[t] += 1));
      btn.classList.add("selected");
      diagStage.querySelectorAll(".opt-btn").forEach((b) => (b.disabled = true));
      setTimeout(() => {
        qIndex++;
        if (qIndex < QUESTIONS.length) renderQuestion();
        else renderAnalyzing();
      }, 260);
    });
  });
}

function renderAnalyzing() {
  diagStage.innerHTML = `
    <div class="analyzing">
      <div class="spinner"></div>
      <p>에너지 상태를 분석하고 있어요...</p>
    </div>`;
  setTimeout(renderResult, 1400);
}

function pickResultType() {
  const order = ["passion", "stable", "positive", "growth", "calm"];
  let best = order[0];
  order.forEach((k) => {
    if (scores[k] > scores[best]) best = k;
  });
  return best;
}

let currentResultKey = null;
let slideIdx = 0;
let slideTimer = null;

      <div class="result-actions">
        <button class="btn-print" id="printBtn">처방전 출력</button>
        <button class="btn-restart" id="restartBtn">처음으로</button>
      </div>
    </div>`;

  const dots = diagStage.querySelectorAll(".dot-i");
  const slides = diagStage.querySelectorAll(".card-slide");
  function goSlide(i) {
    slideIdx = i;
    slides.forEach((s) => s.classList.toggle("active", Number(s.dataset.i) === i));
    dots.forEach((d) => d.classList.toggle("active", Number(d.dataset.i) === i));
  }
  dots.forEach((d) =>
    d.addEventListener("click", () => {
      goSlide(Number(d.dataset.i));
      clearInterval(slideTimer);
    })
  );
  slideTimer = setInterval(() => goSlide((slideIdx + 1) % 3), 4000);

  document.getElementById("printBtn").addEventListener("click", () => showReceipt(m));
  document.getElementById("restartBtn").addEventListener("click", () => {
    clearInterval(slideTimer);
    resetDiag();
  });

  // Firebase에 진단 결과 전송 (주방 준비용 — 매출 집계는 처방전 출력 시점에 반영)
  const record = {
    type: "diagnosis",
    name: "진단 손님",
    timestamp: Date.now(),
    body: `[${m.name} 마인드셋]\n🍰 ${m.dessert}\n☕ ${m.coffee}`,
    items: [
      { name: m.dessert, qty: 1, cat: "dessert" },
      { name: m.coffee, qty: 1, cat: "coffee" },
    ],
  };
  safeTickets.push(record).catch((err) => console.error("Firebase 전송 실패:", err));
}

let receiptCounted = false;
function showReceipt(m) {
  // 처방전을 실제로 출력(=수령)하는 시점에 한해 매출로 집계 (같은 결과에서 중복 클릭해도 1회만 반영)
  if (!receiptCounted) {
    const dessertPrice = MENU_PRICE_MAP[m.dessert] || 0;
    const coffeePrice = MENU_PRICE_MAP[m.coffee] || 0;
    const diagItems = [
      { name: m.dessert, qty: 1, price: dessertPrice },
      { name: m.coffee, qty: 1, price: coffeePrice },
    ];
    safeSales.record(dessertPrice + coffeePrice, diagItems);
    receiptCounted = true;
  }
  const overlay = document.getElementById("receiptOverlay");
  const body = document.getElementById("receiptBody");
  body.innerHTML = `
    <h4>T2B · Sip &amp; Bite</h4>
    <div class="sub">MIND ENERGY PRESCRIPTION</div>
    <hr>
    <div class="line big"><span>${m.name} 마인드셋</span><span></span></div>
    <div class="line" style="margin-top:6px;">${escapeHtml(m.catch)}</div>
    <hr>
    <div class="line"><span>BITE</span><span>${m.dessert}</span></div>
    <div class="line"><span>SIP</span><span>${m.coffee}</span></div>
    <hr>
    <div class="line" style="color:#8a7d68;">${nowTime()} 발급 · 카운터에 보여주세요</div>
    <button class="receipt-close" id="receiptClose">닫기</button>`;
  overlay.classList.add("show");
  document.getElementById("receiptClose").addEventListener("click", () => overlay.classList.remove("show"));
}

resetDiag();


/* =========================================================
   직접 주문 (메뉴 · 장바구니)
   ========================================================= */
const MENU = {
  coffee: [
    { name: "콜롬비아 우일라", note: "시트러스 · 코코아 베이스", price: 4800, mindset: "passion" },
    { name: "에티오피아 예가체프", note: "자스민 · 홍차 향", price: 5200, mindset: "stable" },
    { name: "케냐 AA", note: "자몽 · 흑설탕의 조화", price: 5200, mindset: "positive" },
    { name: "브라질 미나스제라이스", note: "견과류 · 묵직한 바디감", price: 4800, mindset: "growth" },
    { name: "에티오피아 구지", note: "베르가못 · 복숭아 향", price: 5200, mindset: "calm" },
  ],
  dessert: [
    { name: "오렌지 파운드 케이크", note: "상큼한 오렌지 글레이즈", price: 5500, mindset: "passion" },
    { name: "말차 파운드 케이크", note: "쌉쌀한 말차 글레이즈", price: 5500, mindset: "stable" },
    { name: "레몬 파운드 케이크", note: "새콤달콤 레몬 글레이즈", price: 5500, mindset: "positive" },
    { name: "헤이즐넛 파운드 케이크", note: "진한 부드러운 헤이즐넛", price: 5800, mindset: "growth" },
    { name: "얼그레이 파운드 케이크", note: "은은한 얼그레이 글레이즈", price: 5500, mindset: "calm" },
  ],
};

const MENU_PRICE_MAP = {};
[...MENU.coffee, ...MENU.dessert].forEach((item) => (MENU_PRICE_MAP[item.name] = item.price));

let currentCat = "coffee";
let cart = {}; // name -> {qty, price}

const menuGrid = document.getElementById("menuGrid");
function renderMenu() {
  menuGrid.innerHTML = MENU[currentCat]
    .map((item) => {
      const m = MINDSETS[item.mindset];
      return `
      <div class="menu-card" data-name="${escapeHtml(item.name)}" data-price="${item.price}">
        <span class="tag" style="background:${m.color}">${m.name}</span>
        <div class="add-hint">＋</div>
        <div class="name">${escapeHtml(item.name)}</div>
        <div class="note">${escapeHtml(item.note)}</div>
        <div class="price">${item.price.toLocaleString()}원</div>
      </div>`;
    })
    .join("");
  menuGrid.querySelectorAll(".menu-card").forEach((card) => {
    card.addEventListener("click", () => {
      const name = card.dataset.name;
      const price = Number(card.dataset.price);
      if (!cart[name]) cart[name] = { qty: 0, price, cat: currentCat };
      cart[name].qty += 1;
      renderCart();
    });
  });
}

document.querySelectorAll(".cat-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".cat-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    currentCat = btn.dataset.cat;
    renderMenu();
  });
});

const cartItemsEl = document.getElementById("cartItems");
const cartTotalEl = document.getElementById("cartTotal");
const orderBtn = document.getElementById("orderConfirmBtn");

function renderCart() {
  const names = Object.keys(cart).filter((n) => cart[n].qty > 0);
  if (names.length === 0) {
    cartItemsEl.innerHTML = `<div class="cart-empty">메뉴를 선택해주세요</div>`;
    orderBtn.disabled = true;
    cartTotalEl.textContent = "0원";
    return;
  }
  cartItemsEl.innerHTML = names
    .map(
      (n) => `
    <div class="cart-item">
      <span>${escapeHtml(n)}</span>
      <div class="qty-ctrl">
        <button data-n="${escapeHtml(n)}" data-d="-1">−</button>
        <span>${cart[n].qty}</span>
        <button data-n="${escapeHtml(n)}" data-d="1">＋</button>
      </div>
    </div>`
    )
    .join("");
  cartItemsEl.querySelectorAll("button").forEach((b) => {
    b.addEventListener("click", () => {
      const n = b.dataset.n;
      cart[n].qty += Number(b.dataset.d);
      if (cart[n].qty <= 0) delete cart[n];
      renderCart();
    });
  });
  const total = names.reduce((sum, n) => sum + cart[n].qty * cart[n].price, 0);
  cartTotalEl.textContent = total.toLocaleString() + "원";
  orderBtn.disabled = false;
}

orderBtn.addEventListener("click", () => {
  const names = Object.keys(cart).filter((n) => cart[n].qty > 0);
  if (names.length === 0) return;
  const nameInput = document.getElementById("orderName");
  const customer = nameInput.value.trim() || "주문 손님";
  const bodyLines = names.map((n) => `${n} x${cart[n].qty}`).join("\n");
  const items = names.map((n) => ({ name: n, qty: cart[n].qty, price: cart[n].price, cat: cart[n].cat }));
  const amount = items.reduce((sum, it) => sum + it.qty * it.price, 0);
  const record = { type: "order", name: customer, timestamp: Date.now(), body: bodyLines, amount, items };
  safeTickets.push(record).catch((err) => console.error("Firebase 전송 실패:", err));
  safeSales.record(amount, items);
  cart = {};
  nameInput.value = "";
  renderCart();
  orderBtn.textContent = "주문 완료 ✓";
  setTimeout(() => (orderBtn.textContent = "주문하기"), 1400);
});

renderMenu();
renderCart();


/* =========================================================
   대기(idle) 화면
   - 주문/진단 탭에서 일정 시간 터치가 없으면 대기 화면으로 전환
   - 주방 모니터 탭에서는 직원이 계속 봐야 하므로 대기 타이머를 켜지 않음
   - 대기 화면을 터치하면 장바구니/진단 상태를 초기화하고 원래 탭으로 복귀
   ========================================================= */
const IDLE_MS = 45000; // 45초 동안 터치 없으면 대기 화면 표시
const idleOverlay = document.getElementById("idleOverlay");
let idleTimer = null;

function armIdleTimer() {
  clearTimeout(idleTimer);
  if (currentTab === "kitchen") return; // 주방 탭은 대기 화면 대상 아님
  idleTimer = setTimeout(showIdleOverlay, IDLE_MS);
}

function showIdleOverlay() {
  idleOverlay.classList.add("show");
}

function hideIdleOverlayAndReset() {
  idleOverlay.classList.remove("show");
  // 장바구니 초기화
  cart = {};
  renderCart();
  const nameInput = document.getElementById("orderName");
  if (nameInput) nameInput.value = "";
  // 진단 상태 초기화 (진행 중이었거나 결과 화면이었다면 처음으로)
  clearInterval(slideTimer);
  resetDiag();
  // 영수증이 열려 있었다면 닫기
  document.getElementById("receiptOverlay").classList.remove("show");
  armIdleTimer();
}

idleOverlay.addEventListener("click", hideIdleOverlayAndReset);

["click", "touchstart", "keydown"].forEach((evt) => {
  document.addEventListener(
    evt,
    () => {
      if (idleOverlay.classList.contains("show")) return; // 오버레이 자체 클릭은 위에서 별도 처리
      armIdleTimer();
    },
    { passive: true }
  );
});

armIdleTimer();


</script>
</body>
